<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A17" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.5"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#glowGrad)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="50" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#glowGrad)" text-anchor="middle" letter-spacing="1.5" filter="url(#glow)">SK</text>
  <circle cx="75" cy="27" r="4" fill="#00F2FE" />
</svg>
